<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大美山西 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f0f4f8; /* 先用纯色背景保底 */
            /* 如果你有背景图，等网页跑通了，再把下面这行的注释去掉 */
            background-image: url('beij3.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        nav {
            background-color: rgba(44, 62, 80, 0.95);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: all 0.3s ease;
            position:relative;
            padding-bottom:5px;
        }
           nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background-color: #f39c12;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }
        nav a:hover {
            color: #f39c12;
            font-weight: bold;
        }
        /* 这就是真正的 3D 毛玻璃卡片 */
    .container {
            width: 80%;
            max-width: 900px;
            margin: 60px auto;
            background: rgba(255, 255, 255, 0.1); /* 极度通透的底色 */
            backdrop-filter: blur(15px); /* 核心：背景模糊 */
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.8); /* 边缘高光 */
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4); /* 立体阴影 */
            padding: 40px;
            text-align: center;
}

/* 把标题和默认文字变白，防止在黑背景上看不清 */
h1 {
    color: #ffffff; 
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    margin-bottom: 20px;
}

p {
    color: #f0f0f0;
    line-height: 1.8;
}
        /* 这是控制图片大小的样式 */
        .hero-img {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* 给整个网页罩一层黑色的暗光，凸显毛玻璃 */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.35); /* 背景暗度 */
    z-index: -1;
    pointer-events: none;
}
    </style>
</head>
<body>
    <nav>
        <a href="index.html ">首页</a >
        <a href="about.html">山西概况</a >
        <a href="hobby.html">名胜古迹</a >
        <a href="study.html">舌尖美食</a >
        <a href="gallery.html">图文相册</a >
    </nav>

    <main class="container">
    <h1>必打卡的名胜古迹</h1>
<hr style="border: none; height: 2px; background-color: rgba(255,255,255,0.3); margin: 20px auto 40px auto; width: 80%;">

<!-- 景点 1 -->
<div style="display: flex; align-items: center; gap: 30px; margin-bottom: 40px;">
    <img src="pingyaogc.jpg" alt="平遥古城" style="width: 45%; border-radius: 12px; border: 6px solid rgba(255,255,255,0.8); box-shadow: 0 15px 30px rgba(0,0,0,0.5);">
    <div style="width: 55%; text-align: left;">
        <h2 style="color: #f39c12; margin-bottom: 10px; font-size: 24px;">🏯 平遥古城</h2>
        <p style="color: #ffffff; font-size: 16px; line-height: 1.8; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">
            保存最完好的四大古城之一，晋商文化的发源地。走在青石板路上，仿佛穿越回明清。
        </p >
    </div>
</div>

<!-- 景点 2 -->
<div style="display: flex; align-items: center; flex-direction: row-reverse; gap: 30px; margin-bottom: 40px;">
    <img src="yungsk.jpg" alt="云冈石窟" style="width: 45%; border-radius: 12px; border: 6px solid rgba(255,255,255,0.8); box-shadow: 0 15px 30px rgba(0,0,0,0.5);">
    <div style="width: 55%; text-align: left;">
        <h2 style="color: #f39c12; margin-bottom: 10px; font-size: 24px;">🗿 云冈石窟</h2>
        <p style="color: #ffffff; font-size: 16px; line-height: 1.8; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">
            世界文化遗产，北魏时期的佛教艺术巅峰。石窟内的佛像雕刻精美绝伦，震撼人心。
        </p >
    </div>
</div>

<!-- 景点 3 -->
<div style="display: flex; align-items: center; gap: 30px;">
    <img src="wutaishan.jpg" alt="五台山" style="width: 45%; border-radius: 12px; border: 6px solid rgba(255,255,255,0.8); box-shadow: 0 15px 30px rgba(0,0,0,0.5);">
    <div style="width: 55%; text-align: left;">
        <h2 style="color: #f39c12; margin-bottom: 10px; font-size: 24px;">⛰️ 五台山</h2>
        <p style="color: #ffffff; font-size: 16px; line-height: 1.8; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">
            中国佛教四大名山之首，不仅文化底蕴深厚，夏季更是绝佳的避暑胜地。
        </p >
    </div>
</div>
      
    </main>
</body>
</html>
