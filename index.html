<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大美山西 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f0f4f8; /* 先用纯色背景保底 */
          
            background-image: url('beij.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        nav {
    background-color: rgba(30, 40, 50, 0.98); /* 极深的黑灰色，几乎不透明 */
    padding: 20px;
    text-align: center;
    position: sticky; 
    top: 0;
    z-index: 9999; /* 核心：把它放在最高层，任何背景图都挡不住它 */
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); /* 加个阴影让它更立体 */
}


        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: all 0.3s ease;
            position:relative;
            padding-bottom: 5px;

        }
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background-color: #f39c12;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }
        nav a:hover {
            color: #f39c12;
            font-weight: bold;
        }
        .container {
            width: 80%;
            max-width: 900px;
            margin: 60px auto;
            background-color: rgba(255, 255, 255, 0.65);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 36px;
        }
        p {
            font-size: 18px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        /* 这是控制图片大小的样式 */
        .hero-img {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
      <!-- 华丽入场过渡页 开始 -->
<div id="welcome-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 20, 20, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease, visibility 0.8s ease;">
    
    <!-- 过渡页的大标题 -->
    <h1 style="color: #f39c12; font-size: 48px; letter-spacing: 5px; text-shadow: 0 0 20px rgba(243, 156, 18, 0.6); margin-bottom: 20px;">
        大美山西
    </h1>
    <p style="color: #ffffff; font-size: 18px; margin-bottom: 40px; letter-spacing: 2px;">
        表里山河，晋善晋美
    </p >
    
    <!-- 进入按钮（用了 onclick 触发消失效果） -->
    <button onclick="document.getElementById('welcome-screen').style.opacity = '0'; setTimeout(function(){document.getElementById('welcome-screen').style.visibility = 'hidden';}, 800);" 
            style="padding: 12px 40px; font-size: 18px; color: #2c3e50; background-color: #f39c12; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 0 20px rgba(243, 156, 18, 0.5); transition: all 0.3s;" 
            onmouseover="this.style.transform='scale(1.1)'; this.style.boxShadow='0 0 30px rgba(243, 156, 18, 0.8)';" 
            onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 0 20px rgba(243, 156, 18, 0.5)';">
        点击进入 →
    </button>
    
</div>
<!-- 华丽入场过渡页 结束 -->

    <nav>
        <a href="index.html ">首页</a >
        <a href="about.html">山西概况</a >
        <a href="hobby.html">名胜古迹</a >
        <a href="study.html">舌尖美食</a >
        <a href="gallery.html">图文相册</a >
    </nav>

    <main class="container">
        <h1>欢迎来到大美山西主页</h1>
        <p>这是《计算机基础》课程设计网页作业。</p >
        <p>在这里你可以了解山西的历史文化、自然风光以及特色美食。</p >
        
     
        <img src="OIP-C.webp" alt="山西风景" class="hero-img">
    </main>
</body>
</html>
