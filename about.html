<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大美山西 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
    font-family: "Microsoft Yahei", sans-serif;
    /* 换成你文件夹里好看的风景图，比如 hukoupbu.jpg 或 beij.jpg */
    background-image: url('beij4.webp'); 
    background-position: center center; 
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: cover; 
    /* 背景呼吸动画 */
    animation: bgBreathe 8s ease-in-out infinite; 
}

/* 暗光遮罩：极其关键！让白字和玻璃凸显出来 */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.4); /* 0.4的暗度 */
    z-index: -1;
    pointer-events: none;
}

/* 背景呼吸动画剧本 */
@keyframes bgBreathe {
    0% { background-size: 100% auto; }
    50% { background-size: 110% auto; }
    100% { background-size: 100% auto; }
}
        nav {
            background-color: rgba(44, 62, 80, 0.95);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }
      


/* 在 nav a 下面加上这段 */
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background-color: #f39c12;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }
        nav a:hover {
            color: #f39c12;
            font-weight: bold;
        }
        .container {
            width: 80%;
            max-width: 900px;
            margin: 60px auto;
            background-color: rgba(30, 30, 30, 0.65);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 36px;
        }
        p {
            font-size: 18px;
            color: #dddddd;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        /* 这是控制图片大小的样式 */
        .hero-img {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(100px);
       }
        to {
            opacity: 1;
            transform: translateY(0);
        }
}


/* 2. 让页面的标题和文字默认先隐藏，并应用动画 */
.container h1, 
.container p,
.container img {
    opacity: 0;
    animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
}

/* 3. 排兵布阵，制造“重叠感”的延迟 */
.container h1 { animation-delay: 0.1s; }
.container p:nth-of-type(1) { animation-delay: 0.2s; } /* 第一行 */
.container p:nth-of-type(2) { animation-delay: 0.3s; } /* 第二行 */
.container p:nth-of-type(3) { animation-delay: 0.4s; } /* 第三行 */
.container img { animation-delay: 0.5s; } /* 图片最后压轴出场 */
    </style>
</head>
<body>
    <nav>
        <a href="index.html ">首页</a >
        <a href="about.html">山西概况</a >
        <a href="hobby.html">名胜古迹</a >
        <a href="study.html">舌尖美食</a >
        <a href="gallery.html">图文相册</a >
    </nav>

    <main class="container">
        
        <h1>山西概况：表里山河</h1>
        <p><strong>地理位置：</strong>地处华北，东依太行山，西、南依吕梁山、黄河。</p >
        <p><strong>历史底蕴：</strong>华夏文明的重要发祥地之一，被誉为“中国古代文化博物馆”。</p >
        <p><strong>文化名片：</strong>晋商文化、佛教文化、根祖文化交相辉映。</p >


<img src="pingyaogc.jpg" alt="平遥古城" class="hero-img" style="box-shadow: 0 15px 30px rgba(0,0,0,0.3); border-radius: 12px; animation: fadeInUp 1s ease-out forwards; transition: transform 0.3s;" onmouseover="this.style.transform='translateY(-10px) scale(1.02)'" onmouseout="this.style.transform='translateY(0) scale(1)'">        
</body>
</html>
