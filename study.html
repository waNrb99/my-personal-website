    <title>大美山西 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f0f4f8; /* 先用纯色背景保底 */
            /* 如果你有背景图，等网页跑通了，再把下面这行的注释去掉 */
            /* background-image: url('bg.jpg'); */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        nav {
            background-color: rgba(44, 62, 80, 0.95);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: 0.3s;
        }
        nav a:hover {
            color: #f39c12;
            font-weight: bold;
        }
        .container {
            width: 80%;
            max-width: 900px;
            margin: 60px auto;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 36px;
        }
        p {
            font-size: 18px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        /* 这是控制图片大小的样式 */
        .hero-img {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

    <main class="container">
        <h1>舌尖上的山西</h1>
        <blockquote style="font-style: italic; color: #f39c12; font-size: 20px; margin: 20px 0;">
    “世界面食在中国，中国面食在山西。”
       </blockquote>
       <p>山西素有“面食之乡”的美誉，一碗刀削面，配上几滴正宗的老陈醋，是无数山西游子最深的乡愁。</p >
       <p>除了面食，平遥牛肉、过油肉也是不可错过的美味。</p >
