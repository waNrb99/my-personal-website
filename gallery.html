<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大美山西 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f0f4f8; /* 先用纯色背景保底 */
            /* 如果你有背景图，等网页跑通了，再把下面这行的注释去掉 */
            background-image: url('beij2.webp'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        nav {
            background-color: rgba(44, 62, 80, 0.95);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: all 0.3s esae;
            position:relative;
            padding-bottom:5px;
        }
           nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background-color: #f39c12;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }
        nav a:hover {
            color: #f39c12;
            font-weight: bold;
        }
        .container {
            width: 80%;
            max-width: 900px;
            margin: 60px auto;
            background-color: rgba(255, 255, 255, 0.65);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 36px;
        }
        p {
            font-size: 18px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        /* 这是控制图片大小的样式 */
        .hero-img {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* 定义背景呼吸动画 */
        @keyframes bgBreathe {
            0% { background-size: 100% auto; }
            50% { background-size: 110% auto; }
            100% { background-size: 100% auto; }
}
        body {
    /* ...前面必须有背景图的设置... */
               background-image: url('beij2.webp'); 
    /* ...下面必须要有这两行，动画才会生效... */
               animation: bgBreathe 8s ease-in-out infinite;
               background-position: center center; 
}
/* 图片缓慢上下漂浮的动画 */
@keyframes floatUpDown {
    0% { transform: translateY(0); }
    50% { transform: translateY(-20px); } /* 向上飘20像素 */
    100% { transform: translateY(0); }
}
    </style>
</head>
<body>
    <nav>
        <a href="index.html ">首页</a >
        <a href="about.html">山西概况</a >
        <a href="hobby.html">名胜古迹</a >
        <a href="study.html">舌尖美食</a >
        <a href="gallery.html">图文相册</a >
    </nav>

    <main class="container">
      
      <h1 style="color: #ffffff; text-shadow: 2px 2px 5px rgba(0,0,0,0.6); margin-bottom: 20px;">山西风光掠影</h1>

<p style="color: #555555; font-weight: bold; margin-bottom: 40px;">用镜头记录三晋大地的壮美。</p >
<div style="display: flex; justify-content: center; gap: 50px;">
    
    <!-- 左边的图 -->
    <div style="width: 42%; animation: floatUpDown 4s ease-in-out infinite;">
        <img src="OIP-C.webp" alt="山西风景" style="width: 100%; height: 250px; object-fit: cover; border-radius: 16px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.08)'" onmouseout="this.style.transform='scale(1)'">
       
        <p style="font-size: 16px; color: #2c3e50; font-weight: bold; margin-top: 15px; text-shadow: 0 0 8px rgba(255,255,255,0.8);">🏯 古城暮色，岁月静好</p >
    </div>

    <!-- 右边的图 (延迟一点点，制造波浪感) -->
    <div style="width: 42%; animation: floatUpDown 4s ease-in-out 1.5s infinite;">
        <img src="daohaohs.jpg" alt="大好河山" style="width: 100%; height: 250px; object-fit: cover; border-radius: 16px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.08)'" onmouseout="this.style.transform='scale(1)'">
        
        <p style="font-size: 16px; color: #2c3e50; font-weight: bold; margin-top: 15px; text-shadow: 0 0 8px rgba(255,255,255,0.8);">⛰️ 表里山河，落日余晖</p >
    </div>

</div>

    </main>
</body>
</html>
